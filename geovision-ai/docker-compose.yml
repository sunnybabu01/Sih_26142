version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: geovision-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: geovision_ai
    volumes:
      - mongo_data:/data/db
    networks:
      - geovision-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: geovision-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./ai-service/checkpoints:/app/checkpoints
    networks:
      - geovision-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geovision-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/geovision_ai
      - JWT_SECRET=geovision_satellite_srm_secret_key_2026
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - ./uploads:/usr/src/uploads
      - ./outputs:/usr/src/outputs
    networks:
      - geovision-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geovision-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - geovision-net

volumes:
  mongo_data:

networks:
  geovision-net:
    driver: bridge
